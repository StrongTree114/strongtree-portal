<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrongTree | 个人数字空间</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #f7f9fc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #eef2f6;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #3b82f6;
        }

        h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }

        .description {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid #e5e7eb;
            background-color: #ffffff;
            color: #374151;
        }

        /* 博客主按钮 */
        .btn-blog {
            background-color: #111827;
            color: #ffffff;
            border: none;
        }
        .btn-blog:hover {
            background-color: #374151;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        /* 次级按钮通用悬浮效果 */
        .btn-sftp:hover, .btn-mc:hover, .btn-bilibili:hover, .btn-mcw:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        /* B 站专属悬浮特效 */
        .btn-bilibili:hover {
            color: #FB7299; 
            border-color: #FB7299;
            background-color: #fff0f6;
        }

        /* MCW 专属悬浮特效 */
        .btn-mcw:hover {
            color: #10b981; 
            border-color: #10b981;
            background-color: #ecfdf5;
        }

        /* ====== 底部免责声明样式 ====== */
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f3f4f6; /* 极浅的上边框 */
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.6;
        }

        /* ====== 弹窗样式 (Modal) ====== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: #ffffff;
            padding: 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-content h3 { font-size: 18px; margin-bottom: 10px; }
        .modal-content p { font-size: 14px; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }

        .group-number {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
            margin: 15px 0;
            letter-spacing: 1px;
            user-select: all;
        }

        .close-btn {
            background: #111827;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #374151; }

    </style>
</head>
<body>

<div class="container">
    <div class="logo">S</div>
    <h1>StrongTree 的数字空间</h1>
    <p class="description">
        欢迎来到我的赛博自留地。<br>
        这里存放着我的碎碎念、小资源以及游戏世界。
    </p>

    <a href="/blog" class="btn btn-blog">进入博客</a>
    <a href="http://strongtree.xn--0iv.gay:46542/" target="_blank" class="btn btn-sftp">获取资源</a >
    <button onclick="openMCPopup()" class="btn btn-mc">加入 Minecraft 服务器</button>
    
    <a href="https://space.bilibili.com/你的UID" target="_blank" rel="noopener noreferrer" class="btn btn-bilibili">
        B 站
    </a>

    <a href="https://zh.minecraft.wiki/w/User:你的用户名" target="_blank" rel="noopener noreferrer" class="btn btn-mcw">
        MCW
    </a>

    <!-- 底部免责声明 -->
    <div class="footer-note">
        免责声明：本站无 LGBTQ+ 及相关内容，纯属个人技术折腾与游戏分享。
    </div>

</div>

<!-- 弹窗结构 -->
<div class="modal-overlay" id="mcModal">
    <div class="modal-content">
        <h3>加入 Minecraft 服务器</h3>
        <p>为了保障服务器环境，需进群申请白名单，获取连接地址。</p>
        <span class="group-number">QQ群: 123456789</span>
        <button class="close-btn" onclick="closeMCPopup()">我知道了</button>
    </div>
</div>

<script>
    function openMCPopup() { document.getElementById('mcModal').classList.add('active'); }
    function closeMCPopup() { document.getElementById('mcModal').classList.remove('active'); }
    document.getElementById('mcModal').addEventListener('click', function(e) {
        if (e.target === this) { closeMCPopup(); }
    });
</script>

</body>
</html>
