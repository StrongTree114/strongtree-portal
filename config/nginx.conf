worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        # 如果你之后要外网访问，把这里的 80 改成你路由器转发的端口，比如 52326
        listen       80;
        server_name  localhost;

        # 默认主页路径（指向 nginx 目录下的 html 文件夹）
        location / {
            root   html;
            index  index.html index.htm;
        }

        # 博客路径映射
        location /blog/ {
            alias D:/server/nginx/html/strongtree-files/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # SFTPGo 反向代理
        location /sftp/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 错误页面配置
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}